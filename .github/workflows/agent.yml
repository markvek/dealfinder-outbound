name: Local agent
on:
  push:
    paths: ['agent/**', 'install-*.sh', 'install-*.ps1', '.github/workflows/agent.yml']
  pull_request:
    paths: ['agent/**', 'install-*.sh', 'install-*.ps1', '.github/workflows/agent.yml']
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm --prefix agent ci
      - run: npm --prefix agent test
      - run: node agent/cli.mjs help
      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install-windows.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Check macOS installer syntax
        if: runner.os == 'macOS'
        run: bash -n install-mac.sh
